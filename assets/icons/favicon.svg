<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>

    <!-- Main background -->
    <linearGradient
      id="bgGradient"
      x1="40"
      y1="40"
      x2="470"
      y2="470"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#070707"/>
      <stop offset="35%" stop-color="#17100B"/>
      <stop offset="68%" stop-color="#D94E0A"/>
      <stop offset="100%" stop-color="#FF7A18"/>
    </linearGradient>

    <!-- Orange glow -->
    <radialGradient
      id="orangeGlow"
      cx="390"
      cy="115"
      r="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FF9A3D" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#F97316" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- F gradient -->
    <linearGradient
      id="fGradient"
      x1="175"
      y1="115"
      x2="345"
      y2="400"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#FFF7ED"/>
      <stop offset="72%" stop-color="#ffcca3"/>
      <stop offset="100%" stop-color="#FF8A32"/>
    </linearGradient>

    <!-- F highlight -->
    <linearGradient
      id="highlightGradient"
      x1="185"
      y1="120"
      x2="300"
      y2="300"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft shadow -->
    <filter
      id="shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="18"
        flood-color="#2c1705"
        flood-opacity="0.45"
      />
    </filter>

    <!-- F glow -->
    <filter
      id="fGlow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feDropShadow
        dx="0"
        dy="4"
        stdDeviation="8"
        flood-color="#FF7A18"
        flood-opacity="0.35"
      />
    </filter>

    <!-- Subtle shine -->
    <linearGradient
      id="shine"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

  </defs>

  <!-- Main rounded square -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="82"
    fill="url(#bgGradient)"
    filter="url(#shadow)"
  />

  <!-- Orange atmospheric glow -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="82"
    fill="url(#orangeGlow)"
  />

  <!-- Subtle glass-like shine -->
  <rect
    x="17"
    y="17"
    width="478"
    height="478"
    rx="81"
    fill="url(#shine)"
  />

  <!-- F shadow -->
  <path
    d="
      M168 112
      H358
      V170
      H231
      V221
      H341
      V273
      H231
      V401
      H168
      Z
    "
    fill="#000000"
    opacity="0.28"
    transform="translate(5 8)"
  />

  <!-- Main F -->
  <path
    d="
      M168 112
      H358
      V170
      H231
      V221
      H341
      V273
      H231
      V401
      H168
      Z
    "
    fill="url(#fGradient)"
    filter="url(#fGlow)"
  />

  <!-- F highlight -->
  <path
    d="
      M177 122
      H348
      V156
      H221
      V211
      H331
      V238
      H221
      V390
      H177
      Z
    "
    fill="url(#highlightGradient)"
    opacity="0.65"
  />

  <!-- Small accent glow -->
  <circle
    cx="406"
    cy="106"
    r="7"
    fill="#FFFFFF"
    opacity="0.65"
  />

  <circle
    cx="406"
    cy="106"
    r="16"
    fill="#f28826"
    opacity="0.12"
  />

</svg>